<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Security Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .bg-gray-100 { background-color: #f3f4f6; }
        .min-h-screen { min-height: 100vh; }
        .container {
            width: 100%;
            max-width: 960px;
        }
        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }
        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .py-8 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .text-4xl {
            font-size: 2.25rem;
            line-height: 2.5rem;
        }
        .text-2xl {
            font-size: 1.5rem;
            line-height: 2rem;
        }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }
        .text-gray-800 { color: #1f2937; }
        .text-gray-700 { color: #374151; }
        .text-red-600 { color: #dc2626; }
        .text-white { color: #ffffff; }
        .bg-white { background-color: #ffffff; }
        .bg-blue-500 { background-color: #3b82f6; }
        .bg-green-500 { background-color: #10b981; }
        .rounded-lg { border-radius: 0.5rem; }
        .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.1);
        }
        .hidden { display: none; }
        .block { display: block; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .border { border: 1px solid #d1d5db; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .p-6 { padding: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-2 { padding: 0.5rem; }
        .h-64 { min-height: 16rem; }
        textarea,
        input[type="file"],
        button {
            font: inherit;
        }
        textarea,
        input[type="file"] {
            background-color: #ffffff;
        }
        textarea {
            resize: vertical;
            line-height: 1.5;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        button {
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        button.bg-blue-500:hover { background-color: #2563eb; }
        button.bg-green-500:hover { background-color: #059669; }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
        .markdown-content {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            overflow-wrap: anywhere;
        }
        .markdown-content h1 { font-size: 2em; margin-bottom: 0.5em; }
        .markdown-content h2 { font-size: 1.5em; margin-bottom: 0.5em; }
        .markdown-content h3 { font-size: 1.25em; margin-bottom: 0.5em; }
        .markdown-content p { margin-bottom: 1em; }
        .markdown-content code {
            background-color: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        .markdown-content pre {
            background-color: #f6f8fa;
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1em;
            padding-left: 1.5em;
        }
        .markdown-content li {
            margin-bottom: 0.5em;
        }
        .markdown-content blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 1em;
            margin-left: 1em;
            color: #6a737d;
        }
        .markdown-content table {
            border-collapse: collapse;
            margin-bottom: 1em;
            width: 100%;
        }
        .markdown-content th,
        .markdown-content td {
            border: 1px solid #d1d5db;
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-content th {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">Code Security Analyzer</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Analyze Your Code</h2>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="code">
                    Paste your code here:
                </label>
                <textarea id="code" class="w-full h-64 p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    Or upload a ZIP file:
                </label>
                <input type="file" id="file" accept=".zip" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button onclick="analyzeCode()" id="analyze-btn" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Analyze Code
            </button>
        </div>
        
        <div id="loading" class="hidden">
            <div class="loading-spinner"></div>
            <div class="loading-text">Analyzing your code... This may take a few minutes.</div>
        </div>
        
        <div id="result" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-700">Analysis Results</h2>
                <button onclick="openInNewTab()" class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                    View in New Tab
                </button>
            </div>
            <div id="result-content" class="markdown-content"></div>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('code');
        var editor = {
            getValue: function() {
                return codeInput.value;
            }
        };

        let statusCheckInterval;
        let currentAnalysisId = null;

        function renderStatusError(resultContent, message) {
            const errorMessage = document.createElement('div');
            errorMessage.className = 'text-red-600';
            errorMessage.textContent = `Error: ${message}`;
            resultContent.replaceChildren(errorMessage);
        }

        function checkStatus(analysisId) {
            fetch(`{{ url_for('get_status', analysis_id='') }}${analysisId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'completed' || data.status === 'error') {
                        clearInterval(statusCheckInterval);
                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('analyze-btn').disabled = false;

                        const resultDiv = document.getElementById('result');
                        const resultContent = document.getElementById('result-content');

                        if (data.status === 'error') {
                            renderStatusError(resultContent, data.result || 'Unknown error');
                        } else {
                            resultContent.innerHTML = data.result_html || '<p>No results available.</p>';
                        }

                        resultDiv.classList.remove('hidden');
                        currentAnalysisId = analysisId;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    clearInterval(statusCheckInterval);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('analyze-btn').disabled = false;
                    alert('An error occurred while checking the analysis status');
                });
        }

        function openInNewTab() {
            if (currentAnalysisId) {
                window.open(`{{ url_for('view_result', analysis_id='') }}${currentAnalysisId}`, '_blank');
            }
        }

        function analyzeCode() {
            clearInterval(statusCheckInterval);
            const code = editor.getValue();
            const fileInput = document.getElementById('file');
            const formData = new FormData();

            if (code.trim()) {
                formData.append('code', code);
            } else if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            } else {
                alert('Please provide either code or a file to analyze');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('analyze-btn').disabled = true;
            document.getElementById('result').classList.add('hidden');

            fetch('{{ url_for("analyze") }}', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error);
                }

                statusCheckInterval = setInterval(() => checkStatus(data.analysis_id), 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('analyze-btn').disabled = false;
                alert('An error occurred while starting the analysis');
            });
        }
    </script>
</body>
</html>

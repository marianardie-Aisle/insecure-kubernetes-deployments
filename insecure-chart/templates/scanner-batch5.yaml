# INTENTIONAL scanner dogfood fixtures (batch 5) — Low → Critical
---
apiVersion: v1
kind: Namespace
metadata:
  name: scanner-batch5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch5-critical-escape
  namespace: scanner-batch5
  labels:
    aisle.io/fixture-batch: "5"
    aisle.io/severity: "critical"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch5-critical-escape
  template:
    metadata:
      labels:
        app: batch5-critical-escape
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: batch5-critical-sa
      containers:
        - name: escape
          image: centos:7
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN", "ALL"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: containerd
              mountPath: /run/containerd/containerd.sock
            - name: host-root
              mountPath: /host
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch5-critical-sa
  namespace: scanner-batch5
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: batch5-critical-wildcard
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: batch5-critical-wildcard
subjects:
  - kind: ServiceAccount
    name: batch5-critical-sa
    namespace: scanner-batch5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: batch5-critical-wildcard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch5-high-secrets
  namespace: scanner-batch5
  labels:
    aisle.io/severity: "high"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch5-high-secrets
  template:
    metadata:
      labels:
        app: batch5-high-secrets
    spec:
      containers:
        - name: app
          image: mongo:latest
          ports:
            - containerPort: 27017
              hostPort: 27017
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "Batch5-K8s-Scanner-Only-P@ss"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Secret
metadata:
  name: batch5-high-secret
  namespace: scanner-batch5
type: Opaque
stringData:
  aws_access_key_id: AKIAIOSFODNN7EXAMPLE
  aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  mongo_password: Batch5-K8s-Scanner-Only-P@ss
---
apiVersion: v1
kind: Pod
metadata:
  name: batch5-high-hostpath
  namespace: scanner-batch5
  labels:
    aisle.io/severity: "high"
spec:
  containers:
    - name: snoop
      image: busybox:1.25
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: modules
          mountPath: /lib/modules
        - name: crontab
          mountPath: /etc/cron.d
  volumes:
    - name: modules
      hostPath:
        path: /lib/modules
        type: DirectoryOrCreate
    - name: crontab
      hostPath:
        path: /etc/cron.d
        type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: batch5-medium-lb
  namespace: scanner-batch5
spec:
  type: LoadBalancer
  selector:
    app: batch5-high-secrets
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: batch5-medium-nodeport
  namespace: scanner-batch5
spec:
  type: NodePort
  selector:
    app: batch5-critical-escape
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30122
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch5-medium-allow-all
  namespace: scanner-batch5
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batch5-medium-http
  namespace: scanner-batch5
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: batch5-insecure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: batch5-medium-lb
                port:
                  number: 27017
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: batch5-low-deprecated
  namespace: scanner-batch5
  labels:
    aisle.io/severity: "low"
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: batch5-low-deprecated
    spec:
      containers:
        - name: web
          image: python:2.7
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch5-low-debug
  namespace: scanner-batch5
data:
  DEBUG: "true"
  LOG_LEVEL: "trace"
  INTERNAL_TOKEN: "batch5-debug-enabled"

# INTENTIONAL scanner dogfood — mostly Low, plus 2 Critical / 2 High / 2 Medium
---
apiVersion: v1
kind: Namespace
metadata:
  name: scanner-mostly-low
---
# CRITICAL (1): privileged + docker.sock hostPath
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mostly-low-critical-privileged
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "critical"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mostly-low-critical-privileged
  template:
    metadata:
      labels:
        app: mostly-low-critical-privileged
    spec:
      containers:
        - name: privileged
          image: busybox:1.35
          command: ["sleep", "3600"]
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
# HIGH (1): plaintext secrets in env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mostly-low-high-secrets
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "high"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mostly-low-high-secrets
  template:
    metadata:
      labels:
        app: mostly-low-high-secrets
    spec:
      containers:
        - name: app
          image: nginx:1.21
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
---
# MEDIUM (1): NodePort exposing SSH
apiVersion: v1
kind: Service
metadata:
  name: mostly-low-medium-ssh
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "medium"
spec:
  type: NodePort
  selector:
    app: mostly-low-high-secrets
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30322
---
# LOW (1): deprecated API
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: mostly-low-deprecated
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "low"
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: mostly-low-deprecated
    spec:
      containers:
        - name: web
          image: nginx:1.21
---
# LOW (2): missing resource requests/limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mostly-low-no-resources
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "low"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mostly-low-no-resources
  template:
    metadata:
      labels:
        app: mostly-low-no-resources
    spec:
      containers:
        - name: app
          image: nginx:1.21
          securityContext:
            readOnlyRootFilesystem: false
---
# LOW (3): debug ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mostly-low-debug
  namespace: scanner-mostly-low
  labels:
    aisle.io/severity: "low"
data:
  DEBUG: "true"
  LOG_LEVEL: "trace"
  ENABLE_PROFILING: "true"
  INTERNAL_FEATURE_FLAG: "mostly-low-debug-enabled"

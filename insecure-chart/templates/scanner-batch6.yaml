# INTENTIONAL scanner dogfood fixtures (batch 6) — Low → Critical
---
apiVersion: v1
kind: Namespace
metadata:
  name: scanner-batch6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch6-critical-escape
  namespace: scanner-batch6
  labels:
    aisle.io/fixture-batch: "6"
    aisle.io/severity: "critical"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch6-critical-escape
  template:
    metadata:
      labels:
        app: batch6-critical-escape
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: batch6-critical-sa
      containers:
        - name: escape
          image: ubuntu:16.04
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add: ["SYS_MODULE", "DAC_READ_SEARCH", "ALL"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-root
              mountPath: /host
            - name: host-boot
              mountPath: /host-boot
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-boot
          hostPath:
            path: /boot
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch6-critical-sa
  namespace: scanner-batch6
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: batch6-critical-wildcard
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: batch6-critical-wildcard
subjects:
  - kind: ServiceAccount
    name: batch6-critical-sa
    namespace: scanner-batch6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: batch6-critical-wildcard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch6-high-secrets
  namespace: scanner-batch6
  labels:
    aisle.io/severity: "high"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch6-high-secrets
  template:
    metadata:
      labels:
        app: batch6-high-secrets
    spec:
      containers:
        - name: app
          image: rabbitmq:latest
          ports:
            - containerPort: 5672
              hostPort: 5672
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            - name: RABBITMQ_DEFAULT_PASS
              value: "Batch6-K8s-Scanner-Only-P@ss"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Secret
metadata:
  name: batch6-high-secret
  namespace: scanner-batch6
type: Opaque
stringData:
  aws_access_key_id: AKIAIOSFODNN7EXAMPLE
  aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  rabbitmq_password: Batch6-K8s-Scanner-Only-P@ss
---
apiVersion: v1
kind: Pod
metadata:
  name: batch6-high-hostpath
  namespace: scanner-batch6
  labels:
    aisle.io/severity: "high"
spec:
  containers:
    - name: snoop
      image: busybox:1.24
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: var-run
          mountPath: /host-var-run
        - name: shadow
          mountPath: /host-shadow
  volumes:
    - name: var-run
      hostPath:
        path: /var/run
        type: DirectoryOrCreate
    - name: shadow
      hostPath:
        path: /etc/shadow
        type: FileOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: batch6-medium-lb
  namespace: scanner-batch6
spec:
  type: LoadBalancer
  selector:
    app: batch6-high-secrets
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: batch6-medium-nodeport
  namespace: scanner-batch6
spec:
  type: NodePort
  selector:
    app: batch6-critical-escape
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch6-medium-allow-all
  namespace: scanner-batch6
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batch6-medium-http
  namespace: scanner-batch6
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: batch6-insecure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: batch6-medium-lb
                port:
                  number: 5672
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: batch6-low-deprecated
  namespace: scanner-batch6
  labels:
    aisle.io/severity: "low"
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: batch6-low-deprecated
    spec:
      containers:
        - name: web
          image: php:5.6-apache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch6-low-debug
  namespace: scanner-batch6
data:
  DEBUG: "true"
  LOG_LEVEL: "trace"
  INTERNAL_TOKEN: "batch6-debug-enabled"

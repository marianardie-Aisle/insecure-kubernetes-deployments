# INTENTIONAL scanner dogfood fixtures (batch 3) — Low → Critical
# Placed in insecure-chart/templates so IaC/K8s scanners pick them up.
---
apiVersion: v1
kind: Namespace
metadata:
  name: scanner-batch3
---
# CRITICAL: privileged + hostPath docker.sock + hostNetwork
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch3-critical-breakout
  namespace: scanner-batch3
  labels:
    aisle.io/fixture-batch: "3"
    aisle.io/severity: "critical"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch3-critical-breakout
  template:
    metadata:
      labels:
        app: batch3-critical-breakout
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: batch3-critical-sa
      containers:
        - name: breakout
          image: alpine:3.8
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["SYS_ADMIN", "NET_RAW", "ALL"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-root
              mountPath: /mnt/host
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch3-critical-sa
  namespace: scanner-batch3
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: batch3-critical-wildcard
  labels:
    aisle.io/severity: "critical"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: batch3-critical-wildcard
subjects:
  - kind: ServiceAccount
    name: batch3-critical-sa
    namespace: scanner-batch3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: batch3-critical-wildcard
---
# HIGH: secrets in env + latest tag + hostPort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch3-high-secrets
  namespace: scanner-batch3
  labels:
    aisle.io/severity: "high"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch3-high-secrets
  template:
    metadata:
      labels:
        app: batch3-high-secrets
    spec:
      containers:
        - name: app
          image: redis:latest
          ports:
            - containerPort: 6379
              hostPort: 6379
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            - name: REDIS_PASSWORD
              value: "Batch3-K8s-Scanner-Only-P@ss"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Secret
metadata:
  name: batch3-high-secret
  namespace: scanner-batch3
type: Opaque
stringData:
  aws_access_key_id: AKIAIOSFODNN7EXAMPLE
  aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  redis_password: Batch3-K8s-Scanner-Only-P@ss
---
# HIGH: kubelet / kubernetes hostPath
apiVersion: v1
kind: Pod
metadata:
  name: batch3-high-hostpath
  namespace: scanner-batch3
  labels:
    aisle.io/severity: "high"
spec:
  containers:
    - name: snoop
      image: busybox:1.27
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: kubelet
          mountPath: /mnt/kubelet
        - name: k8s
          mountPath: /mnt/kubernetes
  volumes:
    - name: kubelet
      hostPath:
        path: /var/lib/kubelet
        type: DirectoryOrCreate
    - name: k8s
      hostPath:
        path: /etc/kubernetes
        type: DirectoryOrCreate
---
# MEDIUM: LoadBalancer + NodePort SSH
apiVersion: v1
kind: Service
metadata:
  name: batch3-medium-lb
  namespace: scanner-batch3
  labels:
    aisle.io/severity: "medium"
spec:
  type: LoadBalancer
  selector:
    app: batch3-high-secrets
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: batch3-medium-nodeport
  namespace: scanner-batch3
spec:
  type: NodePort
  selector:
    app: batch3-critical-breakout
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 31022
---
# MEDIUM: allow-all NetworkPolicy + HTTP Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch3-medium-allow-all
  namespace: scanner-batch3
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batch3-medium-http
  namespace: scanner-batch3
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: batch3-insecure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: batch3-medium-lb
                port:
                  number: 6379
---
# LOW: deprecated API + debug ConfigMap
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: batch3-low-deprecated
  namespace: scanner-batch3
  labels:
    aisle.io/severity: "low"
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: batch3-low-deprecated
    spec:
      containers:
        - name: web
          image: httpd:2.4.29
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch3-low-debug
  namespace: scanner-batch3
data:
  DEBUG: "true"
  LOG_LEVEL: "trace"
  INTERNAL_TOKEN: "batch3-debug-enabled"

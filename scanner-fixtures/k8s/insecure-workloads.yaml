# INTENTIONAL scanner dogfood fixtures — not for production.
# Severity labels are for test planning; scanners assign their own.

apiVersion: v1
kind: Namespace
metadata:
  name: scanner-fixtures
---
# CRITICAL: privileged container + hostPID/hostNetwork + docker.sock hostPath
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-critical-privileged
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "critical"
    aisle.io/issue: "privileged-container"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-critical-privileged
  template:
    metadata:
      labels:
        app: scanner-critical-privileged
    spec:
      hostPID: true
      hostNetwork: true
      hostIPC: true
      containers:
        - name: privileged
          image: busybox:1.28.0
          command: ["sleep", "3600"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add: ["ALL"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-root
              mountPath: /host
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
# CRITICAL: ClusterRole with wildcard verbs/resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scanner-critical-cluster-admin-lite
  labels:
    aisle.io/fixture: "critical"
    aisle.io/issue: "overprivileged-rbac"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scanner-critical-cluster-admin-lite
  labels:
    aisle.io/fixture: "critical"
subjects:
  - kind: ServiceAccount
    name: default
    namespace: scanner-fixtures
roleRef:
  kind: ClusterRole
  name: scanner-critical-cluster-admin-lite
  apiGroup: rbac.authorization.k8s.io
---
# HIGH: plaintext secrets in env + latest tag + no resource limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-high-secrets-env
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "high"
    aisle.io/issue: "secrets-in-env"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-high-secrets-env
  template:
    metadata:
      labels:
        app: scanner-high-secrets-env
    spec:
      containers:
        - name: app
          image: nginx:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: AKIAIOSFODNN7EXAMPLE
            - name: AWS_SECRET_ACCESS_KEY
              value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            - name: DB_PASSWORD
              value: Scanner-Fixture-Batch1-P@ss
          ports:
            - containerPort: 80
              hostPort: 80
---
# HIGH: hostPath mount of sensitive path + readOnlyRootFilesystem false
apiVersion: v1
kind: Pod
metadata:
  name: scanner-high-hostpath
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "high"
    aisle.io/issue: "hostpath-sensitive"
spec:
  containers:
    - name: reader
      image: busybox:1.35.0
      command: ["sleep", "3600"]
      securityContext:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
      volumeMounts:
        - name: etcd
          mountPath: /mnt/etcd
  volumes:
    - name: etcd
      hostPath:
        path: /var/lib/etcd
        type: DirectoryOrCreate
---
# MEDIUM: NodePort exposing SSH + missing securityContext
apiVersion: v1
kind: Service
metadata:
  name: scanner-medium-nodeport-ssh
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "medium"
    aisle.io/issue: "exposed-ssh"
spec:
  type: NodePort
  selector:
    app: scanner-high-secrets-env
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
# MEDIUM: insecure NetworkPolicy default allow (empty ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-medium-allow-all
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "medium"
    aisle.io/issue: "permissive-network-policy"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
---
# LOW: missing resource requests/limits only (already partly covered) + deprecated API
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: scanner-low-deprecated-api
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "low"
    aisle.io/issue: "deprecated-api"
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: scanner-low-deprecated
    spec:
      containers:
        - name: app
          image: nginx:1.14.2
---
# LOW: ConfigMap with debug credentials smell
apiVersion: v1
kind: ConfigMap
metadata:
  name: scanner-low-debug-config
  namespace: scanner-fixtures
  labels:
    aisle.io/fixture: "low"
data:
  DEBUG: "true"
  LOG_LEVEL: "trace"
  INTERNAL_TOKEN: "batch1-debug-enabled"
